      type: object
      properties:
        refresh:
          type: string
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        phone:
          type: string
          readOnly: true
          nullable: true
      required:
      - email
      - id
      - phone
      - username
    ModeEnum:
