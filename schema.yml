components:
  schemas:
    AnswerDetail:
      type: object
      properties:
        question:
          type: integer
        question_text:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        text_value:
          type: string
          nullable: true
        number_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          nullable: true
        choices:
          type: string
          readOnly: true
      required:
      - choices
      - question
      - question_text
      - type
    AnswerInput:
      type: object
      properties:
        question:
          type: integer
        text:
          type: string
          nullable: true
        number:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          nullable: true
        choices:
          type: array
          items:
            type: integer
      required:
      - question
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Choice:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - label
      - order
    Form:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        is_public:
          type: boolean
        password:
          type: string
          writeOnly: true
        response_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - response_url
      - slug
      - title
      - updated_at
