{% extends "base.html" %}
{% load static %}

{% block title %}مشاهده پاسخ‌ها{% endblock %}

{% block content %}
<div class="container py-4" id="responses-page">
    <h1 class="mb-4">پاسخ‌های فرم‌ها</h1>

    <div id="responses-error" class="mb-3" role="alert"></div>

    <div class="mb-4">
        <label for="form-select" class="form-label">انتخاب فرم</label>
        <select id="form-select" class="form-select">
            <option value="">در حال بارگذاری فرم‌ها...</option>
        </select>
    </div>

    <section aria-labelledby="submissions-heading" class="mb-4">
        <h2 id="submissions-heading" class="h4">فهرست پاسخ‌ها</h2>
        <div id="submissions-loading" class="d-none" role="status">
            در حال بارگذاری پاسخ‌ها...
        </div>
        <div id="submissions-list" class="list-group"></div>

        <div class="d-flex justify-content-between mt-3">
            <button id="previous-page" class="btn btn-outline-secondary" disabled>
                قبلی
            </button>
            <button id="next-page" class="btn btn-outline-secondary" disabled>
                بعدی
            </button>
        </div>
    </section>

    <section aria-labelledby="submission-detail-heading">
        <h2 id="submission-detail-heading" class="h4">جزئیات پاسخ</h2>
        <div id="submission-detail">
            <p class="text-muted">برای مشاهده جزئیات، یک پاسخ را انتخاب کنید.</p>
        </div>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/web-responses.js' %}" defer></script>
{% endblock %}
