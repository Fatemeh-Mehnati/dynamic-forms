<header class="web-header border-bottom">
  <nav class="container web-container py-3" aria-label="ناوبری اصلی">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
      <span class="fw-bold">فرم‌ها و فرایندهای پویا</span>
      {# E2–E7 links belong here only after real HTML routes exist. #}
      {% if user.is_authenticated and user.is_active and user.is_staff %}
        {% url 'admin:index' as admin_url %}
        {% if admin_url %}
          <a href="{{ admin_url }}">پنل مدیریت</a>
        {% endif %}
      {% endif %}
    </div>
  </nav>
</header>
