name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dynamic_forms
          POSTGRES_PASSWORD: dynamic_forms
          POSTGRES_DB: dynamic_forms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynamic_forms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://dynamic_forms:dynamic_forms@localhost:5432/dynamic_forms
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v